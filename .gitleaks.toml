# gitleaks config — adhd monorepo
#
# Used by .githooks/secret-scan.sh (pre-commit) and the CI secret-scan job.
# `useDefault = true` inherits gitleaks' ~150 maintained rules; the blocks below
# only ADD repo-specific coverage and carve out precise, justified exceptions.
#
# Inline escape for a genuine false positive:  append `gitleaks:allow` to the line.

title = "adhd secret-scan"

[extend]
useDefault = true

# ── Repo-specific rules ──────────────────────────────────────────────────────
# This repo drives real LLM providers (agent-mcp): Anthropic, LM Studio, HF.

[[rules]]
id = "adhd-anthropic-api-key"
description = "Anthropic API key (sk-ant-…)"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant"]

[[rules]]
id = "adhd-huggingface-token"
description = "HuggingFace access token (hf_…)"
regex = '''\bhf_[A-Za-z0-9]{34,}\b'''
keywords = ["hf_"]

[[rules]]
id = "adhd-npmrc-auth-token"
description = "npm _authToken in .npmrc"
regex = '''_authToken\s*=\s*[A-Za-z0-9_\-\.]{16,}'''
keywords = ["_authToken"]

[[rules]]
id = "adhd-dotenv-assignment"
description = "Secret-shaped assignment in a .env file"
path = '''(^|/)\.env($|\.)'''
regex = '''(?i)(api[_-]?key|secret|token|password|passwd|credential)\s*=\s*\S{12,}'''

# ── Allowlist ────────────────────────────────────────────────────────────────
[allowlist]
description = "Justified exceptions — each one is a deliberate, reviewed carve-out."

paths = [
  # These files DEFINE secret patterns. They contain regexes, not credentials.
  # Without this, the scanner flags itself and the hook can never be committed.
  '''^\.gitleaks\.toml$''',
  '''^\.githooks/check-no-credentials\.js$''',
  '''^\.github/workflows/pull-request\.yml$''',

  # Templates are meant to be committed and hold placeholders, never values.
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\.sample$''',
  '''(^|/)\.env\.template$''',

  # Lockfiles: integrity hashes are high-entropy but are not credentials.
  '''(^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$''',
]

# Placeholder values that appear in docs, tests, and fixtures.
stopwords = [
  "example",
  "changeme",
  "placeholder",
  "your-api-key",
  "xxxxxxxx",
  "redacted",
  "dummy",
  "fake",
  "test-token",
  "notarealkey",
]

# ── ENV-SEC-003: confirmed false positives, each verified by inspection ──────
# Scoped by VALUE regex, never by rule id. `generic-api-key` fires 4 times: twice on
# the REAL leaked nxCloudAccessToken (ENV-SEC-002) and twice on a public OAuth client
# id. Allowlisting the RULE would silence the real leak.
# NOTE: gitleaks' `allowlist.regexes` is an array of STRINGS. Writing it as
# [[allowlist.regexes]] table-arrays makes gitleaks FTL, emit an empty report, and
# look exactly like "no leaks found". Never let a config error read as clean.
# gitleaks matches allowlist regexes against the SECRET by default; ours are
# line shapes, so target the whole line.
regexTarget = "line"
regexes = [
  # OAuth *client id* is a public identifier, not a secret.
  '''OAUTH_CLIENT_ID\s*=\s*["'][0-9a-f-]{36}["']''',
  # curl example against http://localhost:<port> — no credential present.
  '''curl\s+http://localhost:\d+/''',
]
