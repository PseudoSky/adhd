name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # >=22 required by @adhd/backlog's sox-graph-store/better-sqlite3@^12
          # native-module toolchain (DEBT-BACKLOG-CI-NODE22-001) — `nx affected`
          # runs every project's targets in this one job/runner, so the whole
          # workflow's Node version is the floor for every project it touches.
          node-version: 22

      - name: Install Java (temurin 17)
        # Required by the apigen Java host (packages/apigen/java,
        # FEAT-APIGEN-001) — the extractor/dispatcher/conformance-matrix
        # runner all target Java 17 (maven.compiler.release in pom.xml).
        # ubuntu-latest ships multiple JDKs but not necessarily 17 as
        # `java`'s default on PATH; setup-java pins it explicitly.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - uses: nrwl/nx-set-shas@v4
      - run: git branch --track main origin/main
        if: ${{ github.event_name == 'pull_request' }}

      - run: npx nx format:check
      - run: npx nx affected -t lint test build verify-dist-load

      - name: Backlog migration parity check (divergence report — MIGRATION.md §Phase 2/3)
        # parity-check.mjs itself always exits 0 and only PRINTS divergences —
        # reconciling {sourcePath, filter} rows against the live graph stays a
        # non-blocking report (MIGRATION.md §5 gates promoting that to a hard
        # failure). `continue-on-error: true` here was never actually
        # swallowing divergence output: after the six-verb CLI collapse this
        # script called the retired `list-items` verb, so the CLI exited 4
        # (unknown command), `execFileSync` threw, and continue-on-error was
        # silently swallowing that CRASH instead — a dead gate no divergence
        # or regression in the script itself could ever surface. Now that the
        # script is repaired (six-verb `query --input`, `{ok,data}` envelope)
        # and reliably exits 0/non-zero on report-vs-crash, continue-on-error
        # is removed so a broken script (bad CLI contract, missing dist,
        # malformed manifest row) fails CI instead of being masked again.
        run: |
          npx nx build backlog
          node docs/plan/backlog-adoption/parity-check.mjs
