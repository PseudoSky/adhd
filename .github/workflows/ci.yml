name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # >=22 required by @adhd/backlog's sox-graph-store/better-sqlite3@^12
          # native-module toolchain (DEBT-BACKLOG-CI-NODE22-001) — `nx affected`
          # runs every project's targets in this one job/runner, so the whole
          # workflow's Node version is the floor for every project it touches.
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - uses: nrwl/nx-set-shas@v4
      - run: git branch --track main origin/main
        if: ${{ github.event_name == 'pull_request' }}

      - run: npx nx format:check
      - run: npx nx affected -t lint test build verify-dist-load
