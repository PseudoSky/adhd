name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # >=22 required by @adhd/backlog's sox-graph-store/better-sqlite3@^12
          # native-module toolchain (DEBT-BACKLOG-CI-NODE22-001) — `nx affected`
          # runs every project's targets in this one job/runner, so the whole
          # workflow's Node version is the floor for every project it touches.
          node-version: 22

      - name: Install Java (temurin 17)
        # Required by the apigen Java host (packages/apigen/java,
        # FEAT-APIGEN-001) — the extractor/dispatcher/conformance-matrix
        # runner all target Java 17 (maven.compiler.release in pom.xml).
        # ubuntu-latest ships multiple JDKs but not necessarily 17 as
        # `java`'s default on PATH; setup-java pins it explicitly.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - uses: nrwl/nx-set-shas@v4
      - run: git branch --track main origin/main
        if: ${{ github.event_name == 'pull_request' }}

      - run: npx nx format:check
      - run: npx nx affected -t lint test build verify-dist-load

      - name: Backlog migration Phase-2 parity check (non-blocking soak — MIGRATION.md §Phase 2)
        # Diagnostic only: reports every {sourcePath, filter} projection row
        # where the graph's renderToMarkdown view disagrees with the live
        # hand-edited BACKLOG.md. Never fails the job (continue-on-error) —
        # per MIGRATION.md, this stays non-blocking until Phase 2's soak
        # period proves convergence, at which point Phase 3 promotes it to
        # blocking.
        continue-on-error: true
        run: |
          npx nx build backlog
          node docs/plan/backlog-adoption/parity-check.mjs
