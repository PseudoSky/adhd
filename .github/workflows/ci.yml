name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
      # Force the onnxruntime-node bindings to the CPU execution provider on the
      # CPU-only runner. Without this, onnxruntime-node's install script finds no
      # `nvcc`, "assumes CUDA 12", and downloads the GPU EP; the real-fastembed
      # e2e suites then fail at runtime loading libonnxruntime_providers_cuda.so
      # (`libcublasLt.so.12: cannot open shared object file`). This provisions
      # the CPU EP — it does NOT skip a test.
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # >=22 required by @adhd/backlog's sox-graph-store/better-sqlite3@^12
          # native-module toolchain (DEBT-BACKLOG-CI-NODE22-001) — `nx affected`
          # runs every project's targets in this one job/runner, so the whole
          # workflow's Node version is the floor for every project it touches.
          node-version: 22

      - name: Install Java (temurin 17)
        # Required by the apigen Java host (packages/apigen/java,
        # FEAT-APIGEN-001) — the extractor/dispatcher/conformance-matrix
        # runner all target Java 17 (maven.compiler.release in pom.xml).
        # ubuntu-latest ships multiple JDKs but not necessarily 17 as
        # `java`'s default on PATH; setup-java pins it explicitly.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - uses: nrwl/nx-set-shas@v4
      - run: git branch --track main origin/main
        if: ${{ github.event_name == 'pull_request' }}

      # `format:check` is range-scoped. On a PUSH the base must be the previous
      # tip (`github.event.before`), NOT the `NX_BASE` that `nx-set-shas` pins to
      # the last SUCCESSFUL run: once main is red the base freezes, the range
      # grows on every push, and the gate can never recover on its own (backlog
      # f1ddfb0c). On a PR, nx-set-shas already supplies the correct merge-base.
      - name: Format check (push to main)
        if: github.event_name != 'pull_request'
        run: npx nx format:check --base=${{ github.event.before }} --head=${{ github.sha }}
      - name: Format check (pull request)
        if: github.event_name == 'pull_request'
        run: npx nx format:check
      # Lane-reachability gate — UNCONDITIONAL, before the lanes (same as
      # .github/workflows/pull-request.yml): proves every gate file invokes
      # every target in GATE_TARGETS (tools/gate/lane-gate.mjs), that no
      # `test.dependsOn` re-couples `e2e`, that every `e2e` lane is cached, and
      # that `publish` reaches every declared `e2e`.
      - run: node tools/nx-plugins/test/executors/wiring/check-lane-reachability.mjs
      # Lockfile freshness (backlog 4f26493e AC2): pnpm-lock.yaml must match every
      # package.json. `pnpm install` above is already frozen under CI, but this
      # step names the offending package.json/specifier, and the teeth step proves
      # the gate goes red on a drifted fixture and regenerates green.
      - run: npx nx run @adhd/source:check-lockfile-fresh
      - run: npx nx run @adhd/source:lockfile-gate-teeth
      # Evidence tooling (backlog 65788fd8): check-suite-tree-state, commit-mine and
      # audit-closed-items, each with a negative control; the exit code gates.
      - name: Evidence tooling gates
        run: npx nx run @adhd/source:evidence-gates
      # Published-vs-source parity (backlog 420a7051): no publishable project's
      # source version may be behind its published-state.json version.
      - name: Published-vs-source version parity
        run: npx nx run @adhd/source:check-published-parity
      - run: npx nx affected -t lint test build verify-dist-load
      # `e2e` is the resource-heavy lane (2026-09-28, backlog-e2e-cache-separation;
      # canonical list: tools/gate/lane-gate.mjs — GATE_TARGETS = ['test','e2e']).
      # It binds real ports and spawns real servers/processes, so it runs in its
      # OWN step at --parallel=1, never mixed into the --parallel run above. A
      # regression in these suites must not ship green.
      - run: npx nx affected -t e2e --parallel=1
      # Actionable Store demo acceptance (backlog ddceb069): drives every DEMO
      # beat and the R1-R7 refusal controls through the BUILT backlog CLI; the
      # exit code gates. The second target proves a broken R-control turns the
      # runner red, so the gate cannot go vacuous.
      - name: Demo acceptance (actionable-store)
        run: npx nx run @adhd/source:demo-acceptance
      - name: Demo acceptance teeth (broken control must fail)
        run: npx nx run @adhd/source:demo-acceptance-teeth
      # Tree-clean gate — LAST step (backlog e92e2b92): any tracked-file change or
      # stray untracked file produced by the commands above fails the job.
      - name: Tree-clean gate
        run: npx nx run @adhd/source:check-tree-clean
