name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # >=22 required by @adhd/backlog's sox-graph-store/better-sqlite3@^12
          # native-module toolchain (DEBT-BACKLOG-CI-NODE22-001) — `nx affected`
          # runs every project's targets in this one job/runner, so the whole
          # workflow's Node version is the floor for every project it touches.
          node-version: 22

      - name: Install Java (temurin 17)
        # Required by the apigen Java host (packages/apigen/java,
        # FEAT-APIGEN-001) — the extractor/dispatcher/conformance-matrix
        # runner all target Java 17 (maven.compiler.release in pom.xml).
        # ubuntu-latest ships multiple JDKs but not necessarily 17 as
        # `java`'s default on PATH; setup-java pins it explicitly.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - uses: nrwl/nx-set-shas@v4
      - run: git branch --track main origin/main
        if: ${{ github.event_name == 'pull_request' }}

      - run: npx nx format:check
      # Lane-reachability gate — UNCONDITIONAL, before the lanes (same as
      # .github/workflows/pull-request.yml): proves every gate file invokes
      # every target in GATE_TARGETS (tools/gate/lane-gate.mjs), that no
      # `test.dependsOn` re-couples `e2e`, that every `e2e` lane is cached, and
      # that `publish` reaches every declared `e2e`.
      - run: node tools/nx-plugins/test/executors/wiring/check-lane-reachability.mjs
      - run: npx nx affected -t lint test build verify-dist-load
      # `e2e` is the resource-heavy lane (2026-09-28, backlog-e2e-cache-separation;
      # canonical list: tools/gate/lane-gate.mjs — GATE_TARGETS = ['test','e2e']).
      # It binds real ports and spawns real servers/processes, so it runs in its
      # OWN step at --parallel=1, never mixed into the --parallel run above. A
      # regression in these suites must not ship green.
      - run: npx nx affected -t e2e --parallel=1
