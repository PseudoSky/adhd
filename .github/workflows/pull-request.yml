# File for Pull Request on main branch
name: PR

on:
  pull_request:
    types: [labeled, closed, opened, reopened, synchronize]

jobs:
  # Credential gate. The pre-commit hook is local-only and trivially bypassed
  # (`git commit --no-verify`, or a clone that never ran `pnpm install`), so the
  # hook is fast feedback — THIS job is the enforcement boundary. It runs the
  # same scanner via the same nx target the hook does
  # (`@adhd/nx-secret-scan:scan`, wrapping `.githooks/check-no-credentials.js`),
  # so a commit cannot pass locally and fail differently here.
  secret-scan:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: '8.30.1'
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (verified against the release
          # asset, 8230402 bytes). Bump this together with GITLEAKS_VERSION.
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tgz
          # Fail loudly on a checksum mismatch: a tampered scanner is worse than none.
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c - || {
            echo "::error::gitleaks tarball checksum mismatch — refusing to run a scanner we cannot verify."
            echo "actual: $(sha256sum /tmp/gitleaks.tgz)"
            exit 1
          }
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # The scanner's own teeth tests (unit + real-CLI integration, incl. the
      # large single-line data-dump case that the credential-only scanner missed
      # for months). ~0.5s; runs before the scan so a regressed detector can
      # never report a clean PR.
      - name: Scanner teeth tests
        run: node --test .githooks/check-no-credentials.spec.mjs

      - name: Scan the PR diff for credentials
        env:
          # A missing/broken scanner is a HARD failure in CI, never a silent pass.
          SECRET_SCAN_REQUIRE_GITLEAKS: '1'
        run: |
          CI=true npx nx run @adhd/source:secret-scan --mode=range \
            --base="${{ github.event.pull_request.base.sha }}" \
            --head="${{ github.event.pull_request.head.sha }}"

  test:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NX_NO_CLOUD: true
      GH_MERGED: ${{ github.event.pull_request.merged }}
      GH_ACTION: ${{ github.event.action }}
      GH_PR_COMPLETE: ${{ github.event.action == 'closed' && github.event.pull_request.merged == true }}
      GH_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      GH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_BASE_REF: ${{ github.event.pull_request.base.ref }}
      GH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: n1hility/cancel-previous-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          # >=22 required by @adhd/backlog's sox-graph-store/better-sqlite3@^12
          # native-module toolchain (DEBT-BACKLOG-CI-NODE22-001) — this job's
          # `nx affected -t lint/test/e2e/verify-dist-load` runs every affected
          # project (incl. the resource-heavy e2e lane) on this one runner, so
          # the version here is the floor.
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        id: lint
        run: npx nx affected -t lint --parallel=5

      # Lane-reachability gate — runs UNCONDITIONALLY, BEFORE the lanes, so a
      # mis-wired gate fails in seconds rather than after minutes of tests (or,
      # worse, as a false green). It proves every gate file invokes every target
      # in GATE_TARGETS (tools/gate/lane-gate.mjs), that no `test.dependsOn`
      # re-couples `e2e`, that every `e2e` lane is cached, and that `publish`
      # reaches every declared `e2e`.
      - name: Lane reachability check
        run: node tools/nx-plugins/test/executors/wiring/check-lane-reachability.mjs

      # Two steps, not one: `e2e` is the resource-heavy lane (2026-09-28,
      # backlog-e2e-cache-separation; the lane list is canonicalised in
      # tools/gate/lane-gate.mjs — GATE_TARGETS = ['test','e2e']). It binds real
      # ports and spawns real servers/processes, so it must NOT run at
      # --parallel=5 next to the default lane; it gets its own step at
      # --parallel=1. `Publish` below is guarded by `if: success()`, so an e2e
      # regression still blocks publish.
      - name: Test
        id: test
        run: npx nx affected -t test --parallel=5

      - name: E2E (resource-heavy lane)
        id: e2e
        run: npx nx affected -t e2e --parallel=1

      # Green `test` is NOT proof a published package works — `nx test`
      # resolves everything (including Node builtins, in a Rollup-library
      # project) straight to source via Vite/Vitest, never loading the real
      # production dist/ bundle. `verify-dist-load` closes that gap: it
      # `require()`/`import()`s each affected project's REAL built entry
      # point the way a real consumer would. Confirmed catching a real bug
      # this way: apigen-plugin-api-express built clean and tested
      # 25/25 green while its dist/index.js and dist/index.mjs both threw
      # on load (see BACKLOG). `dependsOn:["build"]` on the target itself
      # means this also builds anything affected-but-not-yet-built.
      - name: Verify dist/ artifacts actually load
        id: verify-dist-load
        run: npx nx affected -t verify-dist-load --parallel=5

      - name: Publish
        id: publish
        if: success() && (contains(github.event.pull_request.labels.*.name, 'publish') || (github.event.action == 'closed' && github.event.pull_request.merged == true))
        run: |
          EXCLUDE=$(npx nx show projects --type=app | tr -s '[:blank:]' ',')
          AFFECTED=$(npx nx show projects --affected --exclude=$EXCLUDE | tr -s '[:blank:]' ',')
          if [ -z "$AFFECTED" ]; then
            echo "No libraries impacted"
            echo "affected=NA" >> $GITHUB_OUTPUT
          else
            npx nx affected -t build --exclude=$EXCLUDE --parallel=4
            # A bare `nx affected -t version/publish` can NEVER publish: the
            # `publish` executor's manifest backstop (release-manifest.js) refuses
            # any project not listed in a fresh .adhd/tmp/release-manifest.json,
            # and the ONLY writer of that manifest is `computeChangedProjectSet`
            # (changed-set.js) — which `pnpm release`/run-release.mjs call, and the
            # bare targets never do. Mint the run token and compute the scope here
            # so the version/publish phases below WRITE and then satisfy that
            # manifest. See PUBLISHING.md "CI publish (automated)" and
            # tools/nx-plugins/build/ci-publish-wiring.spec.mjs.
            export RELEASE_RUN_TOKEN=$(uuidgen)
            RELEASE_PROJECTS=$(node -e 'const {computeChangedProjectSet}=require("./tools/nx-plugins/build/lib/changed-set.js");process.stdout.write(computeChangedProjectSet({workspaceRoot: process.cwd()}).projectNames.join(","));')
            if [ -z "$RELEASE_PROJECTS" ]; then
              echo "No projects in the computed release changed-set — nothing to version/publish"
            else
              npx nx run-many -t version --projects=$RELEASE_PROJECTS
              npx nx run-many -t publish --projects=$RELEASE_PROJECTS --configuration=production
            fi
            echo "affected=$AFFECTED" >> $GITHUB_OUTPUT
          fi

      - name: Find Publish Comment
        uses: peter-evans/find-comment@v2
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'publish') || (github.event.action == 'closed' && github.event.pull_request.merged == true))
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: preview-publish

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v2
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'publish') || (github.event.action == 'closed' && github.event.pull_request.merged == true))
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Packages [preview-publish]
            ### Affected
            ${{ steps.publish.outputs.affected }}
          edit-mode: replace
