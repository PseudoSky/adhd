# File for Pull Request on main branch
name: PR

on:
  pull_request:
    types: [labeled, closed, opened, reopened, synchronize]

jobs:
  # Credential gate. The pre-commit hook is local-only and trivially bypassed
  # (`git commit --no-verify`, or a clone that never ran `yarn`), so the hook is
  # fast feedback — THIS job is the enforcement boundary. It runs the exact same
  # scanner (.githooks/check-no-credentials.js) the hook does, so a commit cannot
  # pass locally and fail differently here.
  secret-scan:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: '8.30.1'
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (verified against the release
          # asset, 8230402 bytes). Bump this together with GITLEAKS_VERSION.
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tgz
          # Fail loudly on a checksum mismatch: a tampered scanner is worse than none.
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c - || {
            echo "::error::gitleaks tarball checksum mismatch — refusing to run a scanner we cannot verify."
            echo "actual: $(sha256sum /tmp/gitleaks.tgz)"
            exit 1
          }
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the PR diff for credentials
        env:
          # A missing/broken scanner is a HARD failure in CI, never a silent pass.
          SECRET_SCAN_REQUIRE_GITLEAKS: '1'
        run: |
          node .githooks/check-no-credentials.js \
            --range "${{ github.event.pull_request.base.sha }}" \
                    "${{ github.event.pull_request.head.sha }}"

  test:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NX_NO_CLOUD: true
      GH_MERGED: ${{ github.event.pull_request.merged }}
      GH_ACTION: ${{ github.event.action }}
      GH_PR_COMPLETE: ${{ github.event.action == 'closed' && github.event.pull_request.merged == true }}
      GH_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      GH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_BASE_REF: ${{ github.event.pull_request.base.ref }}
      GH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: n1hility/cancel-previous-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - name: Install dependencies
        run: yarn

      - name: Lint
        id: lint
        run: npx nx affected -t lint --parallel=5

      - name: Test
        id: test
        run: npx nx affected -t test --parallel=5

      - name: Publish
        id: publish
        if: success() && (contains(github.event.pull_request.labels.*.name, 'publish') || (github.event.action == 'closed' && github.event.pull_request.merged == true))
        run: |
          EXCLUDE=$(npx nx show projects --type=app | tr -s '[:blank:]' ',')
          AFFECTED=$(npx nx show projects --affected --exclude=$EXCLUDE | tr -s '[:blank:]' ',')
          if [ -z "$AFFECTED" ]; then
            echo "No libraries impacted"
            echo "affected=NA" >> $GITHUB_OUTPUT
          else
            npx nx affected -t build --exclude=$EXCLUDE --parallel=4
            npx nx affected -t version --exclude=$EXCLUDE --parallel=4
            npx nx affected -t publish --exclude=$EXCLUDE --configuration=production --parallel=4
            echo "affected=$AFFECTED" >> $GITHUB_OUTPUT
          fi

      - name: Find Publish Comment
        uses: peter-evans/find-comment@v2
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'publish') || (github.event.action == 'closed' && github.event.pull_request.merged == true))
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: preview-publish

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v2
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'publish') || (github.event.action == 'closed' && github.event.pull_request.merged == true))
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Packages [preview-publish]
            ### Affected
            ${{ steps.publish.outputs.affected }}
          edit-mode: replace
